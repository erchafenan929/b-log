# Hexo 站点配置 | https://hexo.io/zh-cn/docs/configuration
# 改完这里记得重新生成：npm run build

title: B-log
subtitle: 用 Markdown 记录点什么
description: 一个用 Hexo + Fluid 搭建的个人博客
author: B-log
language: zh-CN
timezone: Asia/Shanghai

# 部署到 Netlify / GitHub Pages 后，把 url 换成自己的真实域名
url: https://example.com
root: /
# 参考站用的就是「标题即永久链接」的形式，没有日期层级
permalink: :title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# 新建文章时文件名直接用标题，方便和永久链接对应
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  exclude:
  field: site
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# 交给 Fluid 前端的 highlight.js 上色，所以关掉内联高亮
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

index_generator:
  path: ''
  per_page: 10
  order_by: -date
archive_generator:
  per_page: 20
  yearly: true
  monthly: true
  daily: false
category_generator:
  per_page: 20
tag_generator:
  per_page: 20

theme: fluid

deploy:
  type: ''
